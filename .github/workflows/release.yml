name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build release tarball
        run: bash scripts/package-release.sh "${{ steps.version.outputs.version }}"

      - name: Run smoke test
        run: bash scripts/ci-smoke.sh

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            _release/*.tar.gz
            _release/*.sha256
          generate_release_notes: true
          body: |
            ## Installation

            **Quick install:**
            ```bash
            curl -fsSL https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/nyx-${{ steps.version.outputs.version }}-linux-x86_64.tar.gz | tar xz
            cd nyx-${{ steps.version.outputs.version }}-linux-x86_64
            sudo bash install.sh
            ```

            **Build from source:**
            ```bash
            git clone https://github.com/${{ github.repository }}.git
            cd nyx
            cmake -B build -DCMAKE_BUILD_TYPE=Release
            cmake --build build
            sudo cmake --install build
            ```

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md) for details.

  docs:
    needs: build-and-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install docs dependencies
        run: pip install -r requirements-docs.txt

      - name: Build and deploy docs
        run: mkdocs build --strict

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
