name: Feature Request
description: Suggest a new feature or improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for your feature idea! Please describe what you'd like and why.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - new tool
        - existing tool improvement
        - workflow engine
        - shared library / API
        - CLI / interactive shell
        - documentation
        - build / packaging
        - other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What would you like to see added or changed?
    validations:
      required: true

  - type: textarea
    id: use_case
    attributes:
      label: Use Case
      description: How would this help your workflow?

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you tried any workarounds?
